
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6G Smart Antenna - GPS Tracking</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f4f8;
            padding: 25px;
            margin: 0;
        }

        .container {
            background: white;
            max-width: 420px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: #123b67;
        }

        .info {
            background: #eef5ff;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        button {
            padding: 13px 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            color: white;
            cursor: pointer;
        }

        #startBtn {
            background: #16834a;
        }

        #stopBtn {
            background: #d93636;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }

        .note {
            font-size: 13px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>6G Smart Antenna</h2>
    <h3>Live GPS Beam Tracking</h3>

    <div class="info">
        <strong>Latitude:</strong>
        <span id="latitude">Waiting...</span>
        <br>

        <strong>Longitude:</strong>
        <span id="longitude">Waiting...</span>
        <br>

        <strong>GPS Accuracy:</strong>
        <span id="accuracy">Waiting...</span>
        <br>

        <strong>Last Update:</strong>
        <span id="lastUpdate">Not started</span>
    </div>

    <button id="startBtn" onclick="startTracking()">
        Start GPS Tracking
    </button>

    <button id="stopBtn" onclick="stopTracking()">
        Stop Tracking
    </button>

    <p id="status">GPS tracking is stopped.</p>

    <p class="note">
        Keep this webpage open while tracking.
        Allow location permission when requested.
    </p>

</div>

<script>

    // THINGSPEAK SETTINGS

    const CHANNEL_ID = "3563025";

    // Enter your ThingSpeak WRITE API Key here.
    const WRITE_KEY = "2F5PLXVOLTK65L8E";

    // GPS SETTINGS

    let watchID = null;
    let latestPosition = null;
    let lastSentTime = 0;
    let tracking = false;

    // Start GPS tracking

    function startTracking() {

        if (!navigator.geolocation) {
            document.getElementById("status").innerText =
                "GPS is not supported by this browser.";
            return;
        }

        if (tracking) {
            return;
        }

        tracking = true;

        document.getElementById("status").innerText =
            "Waiting for GPS location...";

        watchID = navigator.geolocation.watchPosition(

            function(position) {

                latestPosition = position;

                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                document.getElementById("latitude").innerText =
                    lat.toFixed(6);

                document.getElementById("longitude").innerText =
                    lon.toFixed(6);

                document.getElementById("accuracy").innerText =
                    accuracy.toFixed(2) + " metres";

                document.getElementById("status").innerText =
                    "GPS location received successfully.";

                // Send GPS data to ThingSpeak

                sendGPSData();

            },

            function(error) {

                let message = "GPS Error: ";

                switch(error.code) {
                    case 1:
                        message += "Location permission denied.";
                        break;
                    case 2:
                        message += "Location unavailable.";
                        break;
                    case 3:
                        message += "GPS request timed out.";
                        break;
                    default:
                        message += error.message;
                }

                document.getElementById("status").innerText =
                    message;
            },

            {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 20000
            }
        );
    }


    // Send GPS coordinates to ThingSpeak

    function sendGPSData() {

        if (!latestPosition || !tracking) {
            return;
        }

        // ThingSpeak free accounts require at least
        // 15 seconds between channel updates.

        const now = Date.now();

        if (now - lastSentTime < 16000) {
            return;
        }

        lastSentTime = now;

        const lat = latestPosition.coords.latitude;
        const lon = latestPosition.coords.longitude;
        const accuracy = latestPosition.coords.accuracy;

        const url =
            "https://api.thingspeak.com/update.json" +
            "?api_key=" + encodeURIComponent(WRITE_KEY) +
            "&field1=" + encodeURIComponent(lat) +
            "&field2=" + encodeURIComponent(lon) +
            "&field3=" + encodeURIComponent(accuracy);

        fetch(url, {
            method: "GET",
            mode: "no-cors"
        })
        .then(function() {

            document.getElementById("lastUpdate").innerText =
                new Date().toLocaleTimeString();

            document.getElementById("status").innerText =
                "GPS update request sent to ThingSpeak.";

        })
        .catch(function(error) {

            document.getElementById("status").innerText =
                "Error sending GPS data: " + error.message;

        });
    }


    // Stop GPS tracking

    function stopTracking() {

        tracking = false;

        if (watchID !== null) {
            navigator.geolocation.clearWatch(watchID);
            watchID = null;
        }

        latestPosition = null;

        document.getElementById("status").innerText =
            "GPS tracking stopped.";
    }

</script>

</body>
</html>
